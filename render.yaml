services:
  - type: web
    name: mis-finanzas-web
    runtime: static
    buildCommand: echo "window.API_URL='${API_URL}';" > config.js
    staticPublishPath: .
    envVars:
      - key: API_URL
        sync: false   # lo rellenas tú en el dashboard de Render con la URL del backend
    headers:
      - path: /*
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0
      - path: /*
        name: Pragma
        value: no-cache
